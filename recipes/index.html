    <style>
        .controls-bar-wrap {
            display: flex;
            justify-content: center;
            padding: 16px 20px 8px;
        }
        .controls-bar {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(14px);
            border-radius: 40px;
            box-shadow: 0 2px 18px rgba(0,0,0,0.18);
        }
        .controls-bar > button {
            padding: 7px 16px;
            background: transparent;
            color: #222;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.12s;
            white-space: nowrap;
        }
        .controls-bar > button:hover { background: rgba(0,0,0,0.06); }
        .topFilters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px 20px;
        }
        .topFilters button.tempValue {
            padding: 5px 13px;
            background: rgba(0,0,0,0.35);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
        }
        .topFilters button.tempValue:hover {
            background: rgba(255,255,255,0.25);
        }
        .recipe-notes {
            display: none;
            padding: 8px 10px 6px;
            font-size: 12px;
            color: #ccc;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 4px;
            line-height: 1.5;
        }
        .recipe-notes.open { display: block; }
        .notes-text { margin: 0 0 8px; }
        .recipe-link {
            color: #90c8ff;
            font-size: 12px;
            text-decoration: none;
        }
        .recipe-link:hover { text-decoration: underline; }
    </style>

<body class="gradient">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T4FHGCC"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js"></script>
    <script src="/js/jquery.js"></script>
    <script src="/js/bootstrap.js"></script>
    <script src="/js/sets.js"></script>
    <div class="controls-bar-wrap">
    <div class="controls-bar">
        <button onclick="tpRandom()">Random</button>
        <button onclick="showAll()">Show All</button>
    </div>
    </div>
    <div class="topFilters"></div>
    <div class="flexContainer">
        <div class="ideaList" id="one"></div>
        <div class="ideaList" id="two"></div>
    </div>
    <script>
        function tpRandom(){
            hideAll();
            const elements = document.querySelectorAll('.line_container');
            if (elements.length > 0) {
                const randomIndex = Math.floor(Math.random() * elements.length);
                const randomElement = elements[randomIndex];
                randomElement.style.display = 'inline-block';
                randomElement.querySelector('.ideaText').style.background = 'blue';
            }
        }
    </script>
    <script>
        // =========================================================
        // CONFIG — paste your Google Sheet published CSV URL below
        // File > Share > Publish to web > CSV > copy link
        // =========================================================
        var url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTXmt1Ld8Di_qkROZogpVO-biqX9_b_M4CqNDjTUO2LCaxTX8uODpz_Z7WpEu9AwO0Jxa4s4iEjPpzH/pub?output=csv';
        // =========================================================
        $.ajax({
          url: url,
          success: function (data) {
            var newData = data.replace(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/g, ';');
            $('.ideaList').html('');
            var arrayOfLines = newData.split("\n");
            var arrayOfClassifications = [];
            $.each(arrayOfLines, function (index, value) {
                if (index != 0) {
                    var line_array = value.split(";");
                    var name = line_array[0] ? line_array[0].replace(/"/g, "").trim() : '';
                    var recipeUrl = line_array[1] ? line_array[1].replace(/"/g, "").trim() : '';
                    var notes = line_array[2] ? line_array[2].replace(/"/g, "").trim() : '';
                    var classification = line_array[4] ? line_array[4].replace(/"/g, "").split(",") : [];

                    var classStr = '';
                    for (var c in classification) {
                        var displayClass = classification[c].replace("\r", "").trim();
                        var tempClass = displayClass.replace(/\s+/g, '-');
                        if (!arrayOfClassifications.includes(displayClass) && displayClass != "" && displayClass != null && displayClass != "\r") {
                            arrayOfClassifications.push(displayClass);
                        }
                        classStr += tempClass + " ";
                    }

                    var notesHtml = '';
                    if (notes || recipeUrl) {
                        notesHtml = '<div class="recipe-notes">';
                        if (notes) notesHtml += '<p class="notes-text">' + notes + '</p>';
                        if (recipeUrl && recipeUrl.includes('http')) {
                            notesHtml += '<a class="recipe-link" href="' + recipeUrl + '" target="_blank">View Recipe &rarr;</a>';
                        }
                        notesHtml += '</div>';
                    }

                    var line_html = '<div class="line_container"><div class="ideaText ' + classStr + '">'
                        + '<a class="recipe-toggle" href="#">' + name + '</a>'
                        + notesHtml
                        + '</div></div>';

                    $('#one').append(line_html);
                }
            });
            for (var i = 0; i < arrayOfClassifications.length; i++) {
                var temp = arrayOfClassifications[i];
                if (temp != "" && temp != " " && temp != null && temp.length != 1){
                    var tempButton = '<button class="tempValue" data-classname="' + temp.replace(/\s+/g, '-') + '">' + temp + '</button>';
                    document.querySelector(".topFilters").innerHTML += tempButton;
                }
            }
            runIt();
            document.querySelectorAll('.topFilters button').forEach((e) => {
                e.addEventListener('click', () => {
                    change(e.dataset.classname, "blue");
                });
            });
          },
          error: function (err) {
            console.log(err.status);
          }
        });
    </script>
    <script>
        function runIt() {
            document.querySelectorAll('.recipe-toggle').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    var notes = this.nextElementSibling;
                    if (notes && notes.classList.contains('recipe-notes')) {
                        notes.classList.toggle('open');
                    }
                });
            });
        }
        function change(tempClass, tempColor){
            document.querySelectorAll('.ideaText').forEach((te) => {
                te.parentElement.style.display = "none";
                te.parentElement.style.marginBottom = "0px";
                te.style.background = "#222";
            });
            document.querySelectorAll('.' + tempClass).forEach((ee) => {
                ee.parentElement.style.display = "inline-block";
                ee.parentElement.style.marginBottom = "6px";
                ee.style.background = tempColor;
            });
        }
        function showAll(){
            document.querySelectorAll('.line_container').forEach(function(e){
                e.style.display = "inline-block";
                e.style.marginBottom = "6px";
                e.querySelector('.ideaText').style.background = '#222';
            });
        }
        function hideAll(){
            document.querySelectorAll('.line_container').forEach(function(e){
                e.style.display = "none";
                e.style.marginBottom = "0px";
            });
        }
    </script>
