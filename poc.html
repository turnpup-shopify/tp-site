<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POC • Vercel Serverless Ping</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; margin: 2rem; }
      button { padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      button:hover { background: #f6f6f6; }
      pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 8px; overflow: auto; }
      .row { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
      input { padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>Serverless POC</h1>
    <p>This page calls a Vercel Serverless Function at <code>/api/ping</code>.</p>

    <div class="row">
      <input id="name" placeholder="Optional: name query" />
      <button id="btn">Ping Function</button>
    </div>

    <pre id="out">Click "Ping Function" to call /api/ping…</pre>

    <script>
      const btn = document.getElementById('btn');
      const out = document.getElementById('out');
      const name = document.getElementById('name');

      async function ping() {
        out.textContent = 'Loading…';
        try {
          const q = name.value ? `?name=${encodeURIComponent(name.value)}` : '';
          const res = await fetch(`/api/ping${q}`, {
            method: 'GET',
            headers: { 'accept': 'application/json' }
          });
          const text = await res.text();
          // Try parse as JSON, else show raw text
          try {
            const json = JSON.parse(text);
            out.textContent = JSON.stringify(json, null, 2);
          } catch {
            out.textContent = text;
          }
        } catch (err) {
          out.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
        }
      }

      btn.addEventListener('click', ping);
    </script>
  </body>
  </html>
