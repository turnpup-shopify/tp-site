    <style>
        .controls-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px 20px;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(6px);
        }
        .controls-bar > button {
            padding: 6px 14px;
            background: navy;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .controls-bar > button a { color: white; }
        .controls-bar select {
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            font-size: 13px;
            background: rgba(255,255,255,0.9);
        }
        .controls-bar label {
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .mode-toggle {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.35);
            border-radius: 20px;
            padding: 3px;
        }
        .mode-toggle button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.55);
            padding: 4px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.18s;
        }
        .mode-toggle button.active {
            background: white;
            color: #222;
            font-weight: 600;
        }
        .topFilters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px 20px;
        }
        .topFilters button.tempValue {
            padding: 5px 13px;
            background: rgba(0,0,0,0.35);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
        }
        .topFilters button.tempValue:hover {
            background: rgba(255,255,255,0.25);
        }
        #linkModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .link-modal-box {
            background: #1c1c1c;
            border-radius: 10px;
            padding: 22px 24px;
            min-width: 280px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .link-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            color: white;
            font-size: 15px;
            font-weight: 600;
        }
        .link-modal-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
        }
        .link-modal-close:hover { color: white; }
        .link-modal-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .link-modal-links a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.07);
            border-radius: 6px;
            color: #90c8ff !important;
            font-size: 13px;
            text-decoration: none !important;
            transition: background 0.15s;
            overflow: hidden;
        }
        .link-modal-links a:hover { background: rgba(255,255,255,0.14); }
        .link-row-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 50px;
        }

    <script>
        function tpRandom(){
            hideAll();
            const elements = document.querySelectorAll('.line_container');
            if (elements.length > 0) {
                const randomIndex = Math.floor(Math.random() * elements.length);
                const randomElement = elements[randomIndex];
                randomElement.style.display = 'inline-block';
                randomElement.querySelector('.ideaText').style.background = 'blue';
            } 
        }
    </script>
    <script>
        var url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSuFOd1-Jga9p0qBlAeBMdjEd6zjdLRxYgSaVdsHedU56V7ZBDoeqVdmSfnlNHzzHefCFeZMZExNGd8/pub?output=csv';
        $.ajax({
          url: url,
          success: function (data) {
            var newData = data.replace(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/g, ';');
            $('.ideaList').html(''); 
            var arrayOfLines = newData.split("\n");
            var arrayOfClassifications = [];
            // console.log(arrayOfLines);         
            $.each(arrayOfLines, function (index, value) {
                if (index!=0) {
                    var line_array = value.split(";");
                    if (line_array[0] == "Overall") {
                        console.log(line_array);
                    } else {

                    }
                    let line_html = "<div class='line_container '>";
                    var colCRaw = line_array[2].replace(/"/g, "").trim();
                    var colCHasLinks = colCRaw.toLowerCase().includes("http");
                    var colCLinks = colCHasLinks
                        ? colCRaw.split(",").map(function(s){ return s.trim(); }).filter(function(s){ return s.includes("http"); })
                        : [];
                    var component_array = colCHasLinks ? [] : colCRaw.split("|");
                    var image_array = line_array[3].split("|");

                    var classification = line_array[4].replace(/"/g, "").split(",");
                    line_html += '<div class="ideaText ';
                    for (c in classification){
                        var displayClass = classification[c].replace("\r","").trim();
                        var tempClass = displayClass.replace(/\s+/g, '-');
                        if (!arrayOfClassifications.includes(displayClass) && displayClass != "" && displayClass != null && displayClass != "\r") {
                            arrayOfClassifications.push(displayClass);
                        }
                        line_html += tempClass + " ";
                    }
                    line_html += '">';

                    if(line_array[2]=='\r' || line_array[2]=='') {
                        line_html += '<a href="' + line_array[1] + '">' + line_array[0] + '</a></div></div>';
                    } else if (colCHasLinks) {
                        var colbUrl = (line_array[1] || '').trim();
                        line_html += '<a href="' + colbUrl + '" data-clinks="' + colCLinks.join("||") + '" data-colb="' + colbUrl + '">' + line_array[0] + '</a></div></div>';
                    } else {
                        line_html += '<a href="' + line_array[1] + '">' + line_array[0] + ' </a>';
                        for (let i = 0; i < component_array.length; i++) {
                            if (i==0) {
                                line_html += '<span class="open" data-num=' + i + '>&nbsp;|&nbsp;' + component_array[i].replace(/["']/g, "") + '</span>';
                            } else {
                                line_html += '<span class="open" data-num=' + i + '>&nbsp;|&nbsp;' + component_array[i].replace(/["']/g, "") + '</span>';
                            }
                        }
                        line_html += '</div>';
                        for (let j = 0; j < image_array.length; j++) {
                            if (j==0) {
                                image_html = "<div class='imgContain'>" + '<img class="hide" src="' + image_array[j].replace(/["']/g, "") + '"' + 'data-num=' + j + '>';
                            } else {
                                image_html += '<img class="hide" src="' + image_array[j].replace(/["']/g, "") + '"' + 'data-num=' + j + '>';
                            }
                        }
                        line_html += image_html +'</div>';
                    }
                    line_html += '</div>';
                    if (index % 2 == 1) {
                    	$('#one').append(line_html); 
                    } else {
	                    $('#one').append(line_html);                    
                    }
                } 
            });
            for (var i = 0; i < arrayOfClassifications.length; i++ ) {
                var temp = arrayOfClassifications[i];
                if (temp != "" && temp != " " && temp != null && temp.length != 1){
                    var tempButton= '<button class="tempValue" data-classname="' + temp.replace(/\s+/g, '-') + '">' + temp + '</button>';
                    document.querySelector(".topFilters").innerHTML += tempButton;
                }
            }
            runIt();
            document.querySelectorAll('.topFilters button').forEach((e) => {
                e.addEventListener('click', () => {
                    change(e.dataset.classname, "blue");
                })
            });
            $(".ideaList .open").click(function() {
                var temp = $(this).attr("data-num");                
                var isHidden = $(this).parent().next().find("[data-num='"+temp+"']").hasClass("hide");
                $(this).parent().next().find("img").removeClass("show");
                $(this).parent().next().find("img").addClass("hide");
                if (isHidden) {
                    $(this).parent().next().find("[data-num='"+temp+"']").addClass("show");
                    $(this).parent().next().find("[data-num='"+temp+"']").removeClass("hide");
                } else {
                    $(this).parent().next().find("[data-num='"+temp+"']").addClass("hide");
                    $(this).parent().next().find("[data-num='"+temp+"']").removeClass("show");
                }

            });
          },
          error: function (err) {
            console.log(err.status);
          }
        });
    </script>
    <script>
        function change(tempClass, tempColor){
            document.querySelectorAll('.ideaText').forEach((te) => {
                te.parentElement.style.display = "none";
                te.parentElement.style.marginBottom = "0px";
                te.style.background = "#222";
            })
            var tc = '.' + tempClass;
            document.querySelectorAll('.'+tempClass).forEach((ee) => {                
                ee.parentElement.style.display = "inline-block";
                ee.parentElement.style.marginBottom = "6px";
                ee.style.background = tempColor;
            })
        }
        function showAll(){
            document.querySelectorAll('.line_container').forEach(function(e){
                e.style.display = "inline-block";  
                e.style.marginBottom = "6px";  
                e.querySelector('.ideaText').style.background = '#222';
            })
        }
        function hideAll(){
            document.querySelectorAll('.line_container').forEach(function(e){
                e.style.display = "none";     
                e.style.marginBottom = "0px";             
            })
        }
    </script>

    <script>
        var linkMode = 'direct';
        function setLinkMode(mode) {
            linkMode = mode;
            document.getElementById('btnGoogle').classList.toggle('active', mode === 'google');
            document.getElementById('btnDirect').classList.toggle('active', mode === 'direct');
        }
    </script>
    <script>
        // JavaScript to Intercept Button Click and Navigate to New URL
        function runIt(){
            var allAnchors = document.querySelectorAll(".ideaText a");
            for (let i = 0; i < allAnchors.length; i++) {
                console.log(allAnchors[i].innerText);
                allAnchors[i].addEventListener("click", function(event) {
                    var clinks = this.dataset.clinks;
                    if (clinks) {
                        event.preventDefault();
                        openLinkModal(this.innerText.trim(), this.dataset.colb, clinks);
                        return;
                    }
                    if (linkMode === 'direct') {
                        return; // let the anchor href work naturally
                    }
                    // Prevent any default behavior (if the button is in a form, for example)
                    event.preventDefault();
                                    
                    // Create a base URL
                    const baseURL = "https://google.com/search?q=";

                    let selectedPart = document.getElementById("dropdown").value;
                    console.log(`selectedPart ${selectedPart}`);

                    var theValues = {};
                    // theValues["part1"] = ` "marketing" after:`;
                    theValues["part0"] = ` `;
                    theValues["part1"] = ` "marketing"`;
                    theValues["part2"] = ` "business"`;
                    theValues["part3"] = ` ("strategy" OR "strategies" OR "tactics")`;
                    theValues["part4"] = ` "how" "increased"`;
                    theValues["part5"] = ` "case" OR "case-study"`;
                    theValues["part6"] = ` "how" ("customers")`;
                    theValues["part7"] = ` "how" ("increased" or "grew" or "improved")`;
                    theValues["part8"] = ` ("clever" OR "creative" OR "strategy" OR "tactic" OR "surprising")`;
                    theValues["part9"] = ` ("VP of" OR "Director" OR "Head" OR "founder" ) "how" -job -linkedin`;
                    theValues["part10"] = ` "what" "learn from"`;
                    theValues["part11"] = ` ("Launched" OR "Released" OR "Announced")`;
                    theValues["part12"] = ` ("digital" OR "website")`;
                    theValues["part13"] = ` ("gen z" OR "gen-z")`;
                
                    var thisIsIt = theValues[selectedPart];

                    // Add query parameters or additional path segments
                    const queryParams = thisIsIt;
                    const company = event.target.innerText;

                    if (company == "Overall"){
                        // Step 1: Select all anchor tags and map their inner text to an array
                        // Step 1: Select all .ideaText elements, filter by display block
                        const anchorTexts = Array.from(document.querySelectorAll('.ideaText'))
                            .filter(ideaText => getComputedStyle(ideaText).display === 'block') // Only keep .ideaText elements with display: block
                            .flatMap(ideaText => // Use flatMap to extract anchor texts within each .ideaText
                                Array.from(ideaText.querySelectorAll('a')) // Select all anchor tags within each .ideaText
                                    .map(link => link.textContent.trim()) // Extract inner text of each anchor
                                    .filter(text => text.length > 0) // Filter out empty texts
                                    .filter(text => text != "Overall")
                            );

                        // Log the array of anchor text content
                        console.log(anchorTexts);

                        // Step 2: URL-encode and join with " OR "
                        var query = anchorTexts
                            .map(text => `"${encodeURIComponent(text)}"`) // Wrap in quotes and encode
                            .join(" OR ");
                        
                        query += ") " + queryParams

                        // Get today's date
                        const new_today = new Date();

                        // Subtract one day to get yesterday
                        new_today.setDate(new_today.getDate() - 5);

                        // Format the date as YYYY-MM-DD
                        const new_formattedDate = `${new_today.getFullYear()}-${new_today.getMonth() + 1}-${new_today.getDate()}`;

                        console.log(new_formattedDate);

                        newURL += `${new_formattedDate}`;

                        // Step 3: Construct the Google search URL
                        var searchUrl = `https://www.google.com/search?q=(${query} after:`;
                        searchUrl += `${new_formattedDate}`;

                        window.location.href = searchUrl;

                    } else if ( document.getElementById("myCheckbox").checked == true ) {
                        
                        var newURL = `${baseURL}"${company}"${queryParams}`;

                        const today = new Date();
                        today.setDate(today.getDate() - 5);

                        // Format the date as "YYYY-MM-DD"
                        const formattedDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                        newURL += ` after:${formattedDate}`;

                        window.location.href = newURL;

                    } else {
                
                        var newURL = `${baseURL}"${company}"${queryParams}`;

                        if (newURL.includes("after")) {
                            const today = new Date();
                            const formattedDate = `${today.getFullYear()}-${today.getMonth() + 1}-$ - 5}`;
                            newURL += `${formattedDate}`;
                        }

                        window.location.href = newURL;

                    }
                });
            }
        }

    </script>

    <div id="linkModal" onclick="closeLinkModal(event)">
        <div class="link-modal-box" onclick="event.stopPropagation()">
            <div class="link-modal-header">
                <span id="modalCompanyName"></span>
                <button class="link-modal-close" onclick="closeLinkModal()">✕</button>
            </div>
            <div id="modalLinks" class="link-modal-links"></div>
        </div>
    </div>

    <script>
        function urlLabel(url) {
            try {
                var u = new URL(url);
                var label = u.hostname.replace(/^www\./, '') + u.pathname.replace(/\/$/, '');
                return label.length > 50 ? label.slice(0, 50) + '…' : label;
            } catch(e) {
                return url.length > 50 ? url.slice(0, 50) + '…' : url;
            }
        }
        function openLinkModal(company, colbUrl, clinksStr) {
            document.getElementById('modalCompanyName').textContent = company;
            var container = document.getElementById('modalLinks');
            container.innerHTML = '';
            var colb = (colbUrl || '').trim();
            if (colb && colb.includes('http')) {
                container.innerHTML += '<a href="' + colb + '" target="_blank"><span class="link-row-label">Website</span>' + urlLabel(colb) + '</a>';
            }
            var links = clinksStr.split('||').filter(function(s){ return s.trim(); });
            links.forEach(function(link, idx) {
                var url = link.trim();
                container.innerHTML += '<a href="' + url + '" target="_blank"><span class="link-row-label">Link ' + (idx + 1) + '</span>' + urlLabel(url) + '</a>';
            });
            document.getElementById('linkModal').style.display = 'flex';
        }
        function closeLinkModal(event) {
            if (!event || event.target === document.getElementById('linkModal')) {
                document.getElementById('linkModal').style.display = 'none';
            }
        }
    </script>
