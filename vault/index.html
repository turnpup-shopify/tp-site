<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/vault/">
  <title>Vault</title>
  <link rel="manifest" href="app.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vault">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#7c3aed">
  <style>
    :root {
      --bg: #fafafa;
      --sidebar-bg: #f3f3f3;
      --border: #e5e5e5;
      --text: #1a1a1a;
      --muted: #888;
      --accent: #6d28d9;
      --accent-l: #7c3aed;
      --code-bg: #f1f1f1;
      --link: #2563eb;
      --sidebar-w: 260px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --sidebar-bg: #1a1a1a;
        --border: #2a2a2a;
        --text: #e2e8f0;
        --muted: #666;
        --code-bg: #1e1e1e;
        --link: #60a5fa;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; height: 100dvh; overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .sidebar-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size: 15px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    #search {
      width: 100%; padding: 6px 10px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; font-size: 13px; color: var(--text);
      outline: none;
    }
    #search:focus { border-color: var(--accent); }

    #file-tree {
      flex: 1; overflow-y: auto; padding: 8px 0;
    }

    /* ── Views: all notes ⇄ folder ── */
    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    .filter-toggle {
      display: flex; align-items: center; gap: 6px; width: 100%;
      margin-top: 8px; padding: 4px 2px; background: none; border: none;
      font: inherit; font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer;
    }
    .filter-toggle:hover { color: var(--text); }
    .filter-toggle .chev { margin-left: auto; font-size: 9px; transition: transform 0.15s; }
    .filter-toggle.open .chev { transform: rotate(180deg); }
    .filter-count {
      background: var(--accent); color: #fff; border-radius: 999px;
      padding: 0 6px; font-size: 10px; letter-spacing: 0;
    }
    .filter-count:empty { display: none; }
    #filters { flex-shrink: 0; padding: 10px 0 4px; border-bottom: 1px solid var(--border); }
    #filters .qh-chips + .qh-label { margin-top: 10px; }

    .qh-label {
      padding: 0 16px 6px; font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px;
    }
    .qh-chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 16px; }
    .qh-chip {
      font: inherit; font-size: 12px; padding: 3px 9px;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    .qh-chip:hover { border-color: var(--accent); }
    .qh-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .qh-chip .n { opacity: 0.6; margin-left: 3px; }
    .qh-chip.tag { font-size: 11px; padding: 2px 8px; }
    .qh-empty { padding: 4px 16px; font-size: 12px; color: var(--muted); }

    .fv-back {
      background: none; border: none; font: inherit; font-size: 13px;
      color: var(--accent-l); cursor: pointer; padding: 2px 0; margin-bottom: 6px;
    }
    .fv-back:hover { text-decoration: underline; }
    .fv-path { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .fv-title { font-size: 18px; font-weight: 800; }
    #qh-tags { flex-shrink: 0; padding-top: 10px; }
    #qh-tags:empty { display: none; }
    #qh-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .qh-row .qh-count { margin-left: auto; font-size: 11px; color: var(--muted); }
    .qh-row .qh-chev { color: var(--muted); font-size: 11px; }
    .qh-in-fwd  { animation: qh-fwd 0.16s ease-out; }
    .qh-in-back { animation: qh-back 0.16s ease-out; }
    @keyframes qh-fwd  { from { opacity: 0; transform: translateX(16px); } }
    @keyframes qh-back { from { opacity: 0; transform: translateX(-16px); } }

    .folder-label {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 16px; font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px;
      cursor: pointer; user-select: none;
    }
    .folder-label:hover { color: var(--text); }
    .folder-toggle { font-size: 9px; transition: transform 0.15s; }
    .folder-toggle.open { transform: rotate(90deg); }

    .folder-children { overflow: hidden; }

    .file-item {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 16px 5px 28px;
      font-size: 13px; cursor: pointer;
      color: var(--text); transition: background 0.1s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-item:hover { background: rgba(109,40,217,0.08); }
    .file-item.active {
      background: rgba(109,40,217,0.12);
      color: var(--accent-l); font-weight: 600;
    }
    .file-icon { font-size: 12px; flex-shrink: 0; }

    /* ── Main ── */
    #main {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    }

    #topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 24px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
      min-height: 48px;
    }

    #breadcrumb { font-size: 13px; color: var(--muted); flex: 1; }
    #breadcrumb span { color: var(--text); font-weight: 600; }

    #mobile-toggle {
      display: none; background: none; border: none;
      font-size: 20px; cursor: pointer; padding: 2px 6px; color: var(--text);
    }

    #md-content {
      flex: 1; padding: 40px 48px; max-width: 780px; width: 100%; margin: 0 auto;
    }

    #placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1; gap: 12px;
      color: var(--muted); padding: 40px;
    }
    #placeholder .big { font-size: 48px; }
    #placeholder p { font-size: 14px; text-align: center; }

    #spinner {
      display: none; align-items: center; justify-content: center;
      flex: 1; color: var(--muted); font-size: 14px;
    }

    /* ── Markdown typography ── */
    .md h1, .md h2, .md h3, .md h4 {
      font-weight: 700; line-height: 1.3; margin: 1.6em 0 0.5em;
    }
    .md h1 { font-size: 2em; margin-top: 0; }
    .md h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .md h3 { font-size: 1.15em; }
    .md p  { line-height: 1.75; margin: 1em 0; font-size: 15px; }
    .md a  { color: var(--link); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md ul, .md ol { padding-left: 1.6em; margin: 0.8em 0; }
    .md li { line-height: 1.7; font-size: 15px; margin: 0.2em 0; }
    .md blockquote {
      border-left: 3px solid var(--accent); margin: 1.2em 0;
      padding: 8px 16px; background: rgba(109,40,217,0.05);
      border-radius: 0 6px 6px 0; color: var(--muted);
    }
    .md pre {
      background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; overflow-x: auto; margin: 1em 0;
    }
    .md code {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 13px;
    }
    .md p code, .md li code {
      background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: 12.5px;
    }
    .md table { border-collapse: collapse; width: 100%; margin: 1.2em 0; font-size: 14px; }
    .md th, .md td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .md th { background: var(--code-bg); font-weight: 700; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    .md img { max-width: 100%; border-radius: 8px; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 680px) {
      body { flex-direction: column; }
      #sidebar {
        width: 100%; height: auto; border-right: none;
        border-bottom: 1px solid var(--border);
        display: none; max-height: calc(100dvh - 64px);
        overflow-y: auto; -webkit-overflow-scrolling: touch;
      }
      /* one scroll area on mobile instead of nested ones */
      .view { flex: none; }
      #file-tree, #qh-list { flex: none; overflow: visible; }
      #sidebar.mobile-open { display: flex; }
      #main { overflow-y: auto; }
      #mobile-toggle { display: block; }
      #md-content { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="view-all" class="view">
    <div class="sidebar-head">
      <div class="sidebar-title">Vault</div>
      <input id="search" type="search" placeholder="Search files..." oninput="renderAll()">
      <button class="filter-toggle" id="filter-toggle" onclick="toggleFilters()">
        Filters <span class="filter-count" id="filter-count"></span><span class="chev">▼</span>
      </button>
    </div>
    <div id="filters" style="display:none">
      <div class="qh-label">Folders</div>
      <div class="qh-chips" id="f-folders"></div>
      <div class="qh-label" id="f-tags-label">Tags</div>
      <div class="qh-chips" id="f-tags"></div>
    </div>
    <div id="file-tree"></div>
  </div>

  <div id="view-folder" class="view" style="display:none">
    <div class="sidebar-head">
      <button class="fv-back" id="fv-back" onclick="qhGo(qhPath.length - 1)"></button>
      <div class="fv-path" id="fv-path"></div>
      <div class="fv-title" id="fv-title"></div>
    </div>
    <div class="qh-chips" id="qh-tags"></div>
    <div id="qh-list"></div>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <button id="mobile-toggle" onclick="toggleSidebar()">☰</button>
    <div id="breadcrumb">Select a note →</div>
  </div>
  <div id="placeholder">
    <div class="big">📝</div>
    <p>Select a note from the sidebar<br>or type in the search box.</p>
  </div>
  <div id="spinner">Loading…</div>
  <div id="md-content" class="md" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
  // AUTO-UPDATED by sync_obsidian.sh — do not edit this line manually
  let allFiles = ["2026-08-14.md", "3d/Performations-in-cone.md", "AI.md", "Ecommerce/Copy/Copy-Criteria.md", "Ecommerce/CRO/Cart.md", "Ecommerce/CRO/Checkout.md", "Ecommerce/CRO/PDP.md", "Ecommerce/Meetings/Design-Reviews.md", "FD-AGENTS.md", "FD-CLAUDE.md", "Hapny-Ads.md", "ikigia-home.md", "Marketing/Creative/Strategies.md", "Marketing/Media-Buying/Strategies.md", "obsidian-phone-sync..md", "Recipes/Chicken-Kebab-Burgers.md", "Recipes/Fancy-Tuna-Sandwich.md", "Recipes/Lemon-Parm-Pasta.md", "Recipes/Turkey-Tacos.md", "Retention/Untitled-2.md", "Taxes/401Ks.md", "Taxes/Condo.md", "Taxes/Investments.md", "Untitled-1.md", "Untitled-3.md", "Untitled.md", "Welcome.md"]; // SYNC_MANIFEST

  async function init() {
    // If embedded list is empty, try fetching (works on real servers / GitHub Pages)
    if (allFiles.length === 0) {
      try {
        const r = await fetch('manifest.json');
        if (r.ok) allFiles = await r.json();
      } catch {}
    }
    renderAll();
    loadTags();
    if (location.hash) openFile(decodeURIComponent(location.hash.slice(1)));
  }

  function renderTree(files) {
    document.getElementById('file-tree').innerHTML = renderNode(buildTree(files), '');
  }

  function buildTree(files, base = '') {
    const root = {};
    files.forEach(f => {
      const parts = f.slice(base.length).split('/');
      let node = root;
      parts.forEach((p, i) => {
        if (i === parts.length - 1) {
          (node.__files = node.__files || []).push({ name: p, path: f });
        } else {
          node = (node[p] = node[p] || {});
        }
      });
    });
    return root;
  }

  function renderNode(node, prefix) {
    let html = '';
    (node.__files || []).sort((a,b) => a.name.localeCompare(b.name)).forEach(f => {
      const label = f.name.replace(/\.md$/, '');
      html += `<div class="file-item" data-path="${f.path}" onclick="openFile('${f.path}')" title="${f.path}">
                 <span class="file-icon">📄</span>${label}</div>`;
    });
    Object.keys(node).filter(k => k !== '__files').sort().forEach(folder => {
      const id = 'fd-' + (prefix + folder).replace(/[^a-z0-9]/gi, '_');
      html += `<div class="folder-label" onclick="toggleFolder('${id}')">
                 <span class="folder-toggle open" id="arr-${id}">▶</span>📁 ${folder}
               </div>
               <div class="folder-children" id="${id}">
                 ${renderNode(node[folder], prefix + folder + '/')}
               </div>`;
    });
    return html;
  }

  // ── Quick hits: drill into folders (each click swaps to the submenu), filter by frontmatter tags ──
  const fileTags = {};      // path → [tags]
  let qhPath = [];          // current folder, e.g. ['Ecommerce', 'CRO']
  let qhSelected = new Set();

  async function loadTags() {
    await Promise.all(allFiles.map(async f => {
      try {
        const r = await fetch(encodeURI(f));
        if (r.ok) fileTags[f] = parseTags(await r.text());
      } catch {}
    }));
    renderAll();
    if (qhPath.length) renderQuick();
  }

  function parseTags(text) {
    const fm = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
    if (!fm) return [];
    const m = fm[1].match(/^tags:[ \t]*(.*)$((?:\r?\n[ \t]*-.*)*)/m);
    if (!m) return [];
    const raw = m[1].trim()
      ? m[1].replace(/^\[|\]$/g, '').split(',')
      : m[2].split('\n').map(l => l.replace(/^\s*-\s*/, ''));
    return raw.map(t => t.trim().replace(/^["'#]|["']$/g, '')).filter(Boolean);
  }

  // All-notes view: search + collapsed filters (folder chips jump into folder view, tags filter the tree)
  let rootTags = new Set();

  function toggleFilters() {
    const el = document.getElementById('filters');
    const open = el.style.display === 'none';
    el.style.display = open ? '' : 'none';
    document.getElementById('filter-toggle').classList.toggle('open', open);
  }

  function renderAll() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const hasTags = f => [...rootTags].every(t => (fileTags[f] || []).includes(t));
    renderTree(allFiles.filter(f => (!q || f.toLowerCase().includes(q)) && hasTags(f)));

    const counts = {};
    allFiles.forEach(f => {
      const i = f.indexOf('/');
      if (i > 0) counts[f.slice(0, i)] = (counts[f.slice(0, i)] || 0) + 1;
    });
    document.getElementById('f-folders').innerHTML = Object.keys(counts).sort().map(d =>
      `<button class="qh-chip" onclick="qhOpen('${d}')">📁 ${d}<span class="n">${counts[d]}</span></button>`
    ).join('');

    const tagCounts = {};
    allFiles.forEach(f => (fileTags[f] || []).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
    const tags = Object.keys(tagCounts).sort();
    document.getElementById('f-tags-label').style.display = tags.length ? '' : 'none';
    document.getElementById('f-tags').innerHTML = tags.map(t =>
      `<button class="qh-chip tag${rootTags.has(t) ? ' on' : ''}" onclick="toggleRootTag('${t}')">#${t}<span class="n">${tagCounts[t]}</span></button>`
    ).join('');
    document.getElementById('filter-count').textContent = rootTags.size || '';
    markActive();
  }

  function toggleRootTag(t) {
    rootTags.has(t) ? rootTags.delete(t) : rootTags.add(t);
    renderAll();
  }

  // Folder view: replaces the whole sidebar; drill into subfolders, back goes up a level
  function renderQuick(dir) {
    const base = qhPath.join('/') + '/';
    const inScope = allFiles.filter(f => f.startsWith(base));

    const tagCounts = {};
    inScope.forEach(f => (fileTags[f] || []).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
    qhSelected.forEach(t => { if (!tagCounts[t]) qhSelected.delete(t); });
    const shown = inScope.filter(f => [...qhSelected].every(t => (fileTags[f] || []).includes(t)));

    document.getElementById('fv-back').textContent =
      '‹ ' + (qhPath.length > 1 ? qhPath[qhPath.length - 2] : 'All notes');
    document.getElementById('fv-path').textContent = qhPath.slice(0, -1).join(' / ');
    document.getElementById('fv-title').textContent = '📁 ' + qhPath[qhPath.length - 1];

    document.getElementById('qh-tags').innerHTML = Object.keys(tagCounts).sort().map(t =>
      `<button class="qh-chip tag${qhSelected.has(t) ? ' on' : ''}" onclick="toggleTag('${t}')">#${t}<span class="n">${tagCounts[t]}</span></button>`
    ).join('');

    const sub = {}, here = [];
    shown.forEach(f => {
      const rest = f.slice(base.length), i = rest.indexOf('/');
      if (i > 0) sub[rest.slice(0, i)] = (sub[rest.slice(0, i)] || 0) + 1;
      else here.push(f);
    });
    let html = Object.keys(sub).sort().map(d =>
      `<div class="file-item qh-row" onclick="qhOpen('${d}')">
         <span class="file-icon">📁</span>${d}<span class="qh-count">${sub[d]}</span><span class="qh-chev">›</span></div>`
    ).join('');
    html += here.sort().map(f =>
      `<div class="file-item qh-row" data-path="${f}" onclick="openFile('${f}')" title="${f}">
         <span class="file-icon">📄</span>${f.slice(base.length).replace(/\.md$/, '')}</div>`
    ).join('');
    document.getElementById('qh-list').innerHTML = html || '<div class="qh-empty">No notes match these tags.</div>';
    markActive();

    if (dir) {
      const view = document.getElementById(qhPath.length ? 'view-folder' : 'view-all');
      view.classList.remove('qh-in-fwd', 'qh-in-back');
      void view.offsetWidth;
      view.classList.add(dir === 'fwd' ? 'qh-in-fwd' : 'qh-in-back');
    }
  }

  function showView() {
    const inFolder = qhPath.length > 0;
    document.getElementById('view-all').style.display = inFolder ? 'none' : '';
    document.getElementById('view-folder').style.display = inFolder ? '' : 'none';
  }

  function qhOpen(d) {
    qhPath.push(d);
    showView();
    renderQuick('fwd');
  }

  function qhGo(depth) {
    qhPath = qhPath.slice(0, depth);
    showView();
    if (qhPath.length) return renderQuick('back');
    qhSelected.clear();
    const view = document.getElementById('view-all');
    view.classList.remove('qh-in-fwd', 'qh-in-back');
    void view.offsetWidth;
    view.classList.add('qh-in-back');
  }

  function toggleTag(t) {
    qhSelected.has(t) ? qhSelected.delete(t) : qhSelected.add(t);
    renderQuick();
  }

  function markActive() {
    document.querySelectorAll('.file-item').forEach(el =>
      el.classList.toggle('active', !!currentFile && el.dataset.path === currentFile));
  }

  function toggleFolder(id) {
    const el = document.getElementById(id);
    const arr = document.getElementById('arr-' + id);
    if (!el) return;
    const open = el.style.display !== 'none';
    el.style.display = open ? 'none' : '';
    arr.classList.toggle('open', !open);
  }

  let currentFile = null;

  async function openFile(path) {
    if (currentFile === path) return;
    currentFile = path;
    history.replaceState(null, '', '#' + encodeURIComponent(path));

    markActive();

    const parts = path.replace(/\.md$/, '').split('/');
    document.getElementById('breadcrumb').innerHTML =
      parts.map((p, i) => i === parts.length - 1 ? `<span>${p}</span>` : p).join(' / ');

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('md-content').style.display = 'none';
    document.getElementById('spinner').style.display = 'flex';

    try {
      const r = await fetch(encodeURI(path));
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      document.getElementById('md-content').innerHTML = marked.parse(await r.text());
    } catch (e) {
      document.getElementById('md-content').innerHTML =
        `<p style="color:#ef4444">Could not load <code>${path}</code>: ${e.message}</p>`;
    }

    document.getElementById('spinner').style.display = 'none';
    document.getElementById('md-content').style.display = 'block';
    document.getElementById('main').scrollTop = 0;

    if (window.innerWidth <= 680)
      document.getElementById('sidebar').classList.remove('mobile-open');
  }


  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('mobile-open');
  }

  marked.setOptions({ breaks: true, gfm: true });
  init();

  // Register service worker (needed for install prompt on Chrome/Mac)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
</html>
